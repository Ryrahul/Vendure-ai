name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/ai-chat-plugin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ai-chat-plugin
        run: npm run build -w @rahul_vendure/ai-chat-plugin

      - name: Build backend
        run: npm run build -w server

      - name: Build dashboard
        run: npm run build:dashboard -w server

      - name: Package build artifacts
        run: |
          tar -czf deploy.tar.gz \
            apps/server/dist \
            apps/server/static/email/templates \
            apps/server/package.json \
            packages/ai-chat-plugin/dist \
            packages/ai-chat-plugin/package.json \
            package.json \
            package-lock.json

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy artifacts to server
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'
            set -e

            DEPLOY_DIR="/home/ubuntu/ai-vendure"

            # Create deploy dir if it doesn't exist
            mkdir -p "$DEPLOY_DIR"

            # Extract artifacts
            cd "$DEPLOY_DIR"
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            # Install production dependencies only
            npm ci --omit=dev

            # Restart with PM2
            # Start both server and worker processes
            pm2 delete vendure-server 2>/dev/null || true
            pm2 delete vendure-worker 2>/dev/null || true

            cd "$DEPLOY_DIR/apps/server"
            pm2 start dist/index.js --name vendure-server
            pm2 start dist/index-worker.js --name vendure-worker

            # Save PM2 process list so it survives reboots
            pm2 save

            echo "Deployment complete!"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
